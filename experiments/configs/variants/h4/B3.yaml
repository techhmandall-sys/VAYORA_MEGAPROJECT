# Experiment X1: B3 with model h4 in place of h3; nothing else differs from ../B3.yaml.
# h4 is trained on worlds/proximity_w0.5.yaml (hazard_h4.yaml).
#
# B3: survival-aware ranking. Candidates are ordered by the model's estimate that a
