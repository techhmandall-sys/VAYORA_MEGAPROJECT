# Experiment X5's H5.2 (EXPERIMENT_PROTOCOL.md sections 26 and 31): does survival ranking still gain
# over B0 when there are fewer or more rides? The same grid as supply_density.yaml, with B0 as each
# cell's baseline and B3 (model h3) as the variant. Not offered in the what-if explorer.
name: supply-density-ranking
baseline: variants/B0.yaml
variant: variants/B3.yaml
baseline_per_cell: true
parameters:
  supply.rides_per_day: [6, 12, 20]
