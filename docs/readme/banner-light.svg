<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">VAYORA</title>
  <desc id="d">Shared intercity rides across India. An early cancellation is a success.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6F4EC"/><stop offset="0.55" stop-color="#F8FAFC"/><stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16865A" stop-opacity="0.35"/><stop offset="1" stop-color="#16865A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="400" rx="28"/></clipPath>
    <style>
      .dash { stroke-dasharray: 10 14; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      .pulse { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
      @media (prefers-reduced-motion: reduce) { .dash, .pulse { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
