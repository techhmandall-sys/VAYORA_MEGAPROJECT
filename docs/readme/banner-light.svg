      <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear" path="M1005 322 C 1040 296, 990 268, 1010 242 S 1070 196, 1040 166 S 1000 124, 1060 104"/>
