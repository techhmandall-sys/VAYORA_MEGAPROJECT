    <text x="990" y="247" font-size="16" font-weight="700" text-anchor="end" fill="#10213A">Karad</text>
    <circle cx="1040" cy="166" r="9" fill="#16865A" class="pulse"/>
    <circle cx="1040" cy="166" r="8" fill="#FFFFFF" stroke="#16865A" stroke-width="4"/>
    <text x="1060" y="171" font-size="16" font-weight="700" text-anchor="start" fill="#10213A">Satara</text>
    <circle cx="1060" cy="104" r="9" fill="#16865A" class="pulse"/>
    <circle cx="1060" cy="104" r="8" fill="#FFFFFF" stroke="#16865A" stroke-width="4"/>
