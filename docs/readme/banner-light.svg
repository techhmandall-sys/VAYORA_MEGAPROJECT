      <path d="M-20 110 C 220 70, 420 160, 700 100 S 1100 170, 1300 90"/>
      <path d="M-20 150 C 220 110, 420 200, 700 140 S 1100 210, 1300 130"/>
      <path d="M-20 190 C 220 150, 420 240, 700 180 S 1100 250, 1300 170"/>
      <path d="M-20 230 C 220 190, 420 280, 700 220 S 1100 290, 1300 210"/>
      <path d="M-20 270 C 220 230, 420 320, 700 260 S 1100 330, 1300 250"/>
      <path d="M-20 310 C 220 270, 420 360, 700 300 S 1100 370, 1300 290"/>
      <path d="M-20 350 C 220 310, 420 400, 700 340 S 1100 410, 1300 330"/>
      <path d="M-20 390 C 220 350, 420 440, 700 380 S 1100 450, 1300 370"/>
    </g>
    <circle cx="1030" cy="210" r="190" fill="url(#glow)" opacity="0.35"/>
  </g>
  <rect x="1" y="1" width="1278" height="398" rx="27" fill="none" stroke="#E2E7EE" stroke-width="2"/>

  <g>
    <rect x="72" y="70" width="72" height="72" rx="18" fill="#16865A"/>
    <path d="M92 124 C 108 124, 110 92, 126 88" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="92" cy="124" r="6" fill="#fff"/><circle cx="126" cy="88" r="6" fill="#fff"/>
    <text x="166" y="134" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, 'Nirmala UI', 'Kohinoor Devanagari', sans-serif" font-size="76" font-weight="800" letter-spacing="2" fill="#10213A">VAYORA</text>
  </g>
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, 'Nirmala UI', 'Kohinoor Devanagari', sans-serif">
    <text x="74" y="198" font-size="30" font-weight="600" fill="#10213A">Shared intercity rides across India</text>
    <text x="74" y="240" font-size="22" fill="#3A485C"><tspan font-weight="700" fill="#16865A">An early cancellation is a success.</tspan> We model how long each</text>
    <text x="74" y="270" font-size="22" fill="#3A485C">booking lasts, and act while acting still helps.</text>
  </g>
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, 'Nirmala UI', 'Kohinoor Devanagari', sans-serif" font-size="16" font-weight="600">
    <rect x="74" y="304" width="198" height="38" rx="19" fill="#FFFFFF" stroke="#E2E7EE"/>
    <circle cx="96" cy="323" r="6" fill="#16865A"/>
    <text x="110" y="329" fill="#10213A">Survival analysis</text>
    <rect x="284" y="304" width="214" height="38" rx="19" fill="#FFFFFF" stroke="#E2E7EE"/>
    <circle cx="306" cy="323" r="6" fill="#F59E0B"/>
    <text x="320" y="329" fill="#10213A">SimPy · 30 seeds</text>
    <rect x="510" y="304" width="262" height="38" rx="19" fill="#FFFFFF" stroke="#E2E7EE"/>
    <circle cx="532" cy="323" r="6" fill="#D70015"/>
    <text x="546" y="329" fill="#10213A">English · हिन्दी · मराठी</text>
